<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210">
  <title>GD-SIM-R1 schematic fragment</title>
  <desc>Symbolic host fixture, independent of GD32 physical pad numbers.</desc>
